[project]
name = "gadgetbox-analytics"
version = "0.1.0"
requires-python = ">=3.12.6"
dependencies = []

[tool.uv.workspace]
members = ["src/*"]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "pytest>=8.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
