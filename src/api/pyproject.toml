[project]
name = "gadgetbox-api"
version = "0.1.0"
requires-python = ">=3.12.6"
dependencies = [
    # API & Async Backend
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "anyio>=4.3.0",

    # Message Brokers & Caching
    "redis>=5.0.3",
    "aio-pika>=9.4.1",

    # Security & Monitoring
    "hvac>=2.1.0",
    "python-dotenv>=1.0.1",
    "prometheus-client>=0.20.0",
    "grafana-dashboard-manager>=0.1.0",
]
